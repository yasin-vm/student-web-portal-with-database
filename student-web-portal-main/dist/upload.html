<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Share your engineering project with the student community.">
  <meta name="theme-color" content="#f4f7fc">
  <title>Share Your Work | St. Thomas Engineering Showcase</title>
  <link rel="stylesheet" href="/assets/portal-launch.css">
  <script defer src="/assets/portal-app.js"></script>
</head>
<body data-page="upload">
  <header id="site-header"></header>
  <main class="section-wrap page-main upload-main">
    <div class="page-intro">
      <p class="eyebrow">Your work, out in the world</p>
      <h1>Share what you’ve <em>made.</em></h1>
      <p>Add your project details and share your work with the college community.</p>
    </div>
    <form id="upload-form" class="form-card">
      <div class="form-section-heading"><span>01</span><div><h2>About your project</h2><p>Give people a reason to take a closer look.</p></div></div>
      <label class="form-field"><span>Semester</span><select name="semester"><option value="S1">Semester 1</option><option value="S2">Semester 2</option><option value="S3">Semester 3</option><option value="S4">Semester 4</option><option value="S5">Semester 5</option><option value="S6">Semester 6</option><option value="S7" selected>Semester 7</option><option value="S8">Semester 8</option></select></label>
      <label class="form-field"><span>Project title</span><input name="title" placeholder="What did you make?"></label>
      <label class="form-field"><span>A short introduction</span><textarea name="description" rows="3" placeholder="What inspired it? What does it do?"></textarea></label>
      <label class="form-field"><span>Project files <i>*</i></span></label>
      <label class="drop-zone" id="drop-zone">
        <input id="project-files" type="file" multiple required aria-describedby="file-upload-guidance file-selection">
        <span class="upload-symbol">↑</span><strong id="file-label">Drop your files here, or <u>browse</u></strong>
        <small id="file-upload-guidance">Upload a ZIP, a single file, or select multiple project files. Maximum 10 files, 10 MB per file.</small>
      </label>
      <ul id="file-selection" class="file-selection" aria-live="polite"></ul>
      <div id="upload-status" class="form-status" aria-live="polite"></div>
      <button class="button button-dark form-submit" type="submit">Submit my project <span aria-hidden="true">↗</span></button>
      <p class="privacy-note">By submitting, you confirm these files are yours to share with the college community.</p>
    </form>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
